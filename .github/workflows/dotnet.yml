name: MoxymindApiTask tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build and Run Tests via Docker Compose
      env:
        API_KEY: ${{ secrets.REQRES_API_KEY }}
      run: docker compose up --build --exit-code-from api-tests

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-trx-report
        path: TestResults/*.trx